<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="EinfachRonan Fotografie Portfolio f&uuml;r Portraits, Hochzeiten, Club, Autos und Tiere."
    />
    <title>EinfachRonan | Fotografie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/logo-einfachronan.png" />
    <link rel="stylesheet" href="styles.css?v=cinematic-premium-2" />
  </head>
  <body class="home-page">
    <header class="site-header" data-header>
      <a class="brand" href="/" aria-label="EinfachRonan Startseite">
        <img class="brand-logo" decoding="async" src="assets/logo-einfachronan.png" alt="EinfachRonan" />
      </a>

      <nav class="nav" aria-label="Hauptnavigation">
        <a class="nav-link" href="portfolio.html">Portfolio</a>
        <a class="nav-link" href="#kontakt">Kontakt</a>
        <a class="instagram-link" href="https://www.instagram.com/einfach.ronan/" target="_blank" rel="noreferrer">
          <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <path d="M17.5 6.5h.01"></path>
          </svg>
          <span>@einfach.ronan</span>
        </a>
      </nav>
    </header>

    <main id="start" class="home-main">
      <section class="home-stage">
        <section class="hero hero-home" aria-label="EinfachRonan Startseite">
          <div class="hero-atmosphere" aria-hidden="true">
            <span class="mist mist-one"></span>
            <span class="mist mist-two"></span>
            <span class="mist mist-three"></span>
          </div>

          <div class="hero-media reveal" data-parallax-media>
            <img
              class="hero-slide is-active"
              loading="eager"
              fetchpriority="high"
              decoding="async"
              src="assets/photos/animal-boxer-road-sit.jpg"
              alt="Boxer Portrait"
            />
            <img
              class="hero-slide"
              loading="eager"
              decoding="async"
              src="assets/photos/portrait-rural-man-field.jpg"
              alt="Portrait im warmen Licht"
            />
          </div>

          <div class="hero-shell reveal">
            <div class="hero-content">
              <h1>Telling<br />Stories.</h1>
              <p class="hero-lead">
                Fotografie mit Atmosph&auml;re, Ruhe und einem klaren Blick f&uuml;r echte Momente.
              </p>
              <div class="hero-actions" aria-label="Hero Navigation">
                <a class="button button-primary hero-cta" href="portfolio.html">Mein Portfolio</a>
                <a class="button button-ghost" href="#kontakt">Kontakt</a>
              </div>
            </div>
          </div>
        </section>

        <section class="category-section home-portfolio-section" aria-labelledby="category-title">
          <div class="section-head reveal section-head-compact">
            <div>
              <h2 id="category-title">Bereiche</h2>
            </div>
          </div>

          <div class="category-grid category-grid-home">
            <a class="category-card tilt-card reveal" href="portfolio.html?filter=portrait" data-category-card="portrait" data-category-route="portfolio.html?filter=portrait">
              <img loading="lazy" decoding="async" src="assets/photos/portrait-redhair-sun.webp" alt="Portrait im Sonnenlicht" />
              <div class="category-card-copy">
                <strong>Portrait</strong>
              </div>
            </a>

            <a class="category-card tilt-card reveal" href="portfolio.html?filter=wedding" data-category-card="wedding" data-category-route="portfolio.html?filter=wedding">
              <img loading="lazy" decoding="async" src="assets/photos/wedding-blue-bouquet.webp" alt="Hochzeitsdetail mit Ringen" />
              <div class="category-card-copy">
                <strong>Hochzeit</strong>
              </div>
            </a>

            <a class="category-card tilt-card reveal" href="portfolio.html?filter=club" data-category-card="club" data-category-route="portfolio.html?filter=club">
              <img loading="lazy" decoding="async" src="assets/photos/club-dj-red-light.webp" alt="DJ im Clublicht" />
              <div class="category-card-copy">
                <strong>Club</strong>
              </div>
            </a>

            <a class="category-card tilt-card reveal" href="portfolio.html?filter=auto" data-category-card="auto" data-category-route="portfolio.html?filter=auto">
              <img loading="lazy" decoding="async" src="assets/photos/automotive-audi-night.webp" alt="Auto bei Nacht" />
              <div class="category-card-copy">
                <strong>Autos</strong>
              </div>
            </a>

            <a class="category-card tilt-card reveal" href="portfolio.html?filter=animal" data-category-card="animal" data-category-route="portfolio.html?filter=animal">
              <img loading="lazy" decoding="async" src="assets/photos/animal-cats-window.webp" alt="Katzen am Fenster" />
              <div class="category-card-copy">
                <strong>Tiere</strong>
              </div>
            </a>
          </div>
        </section>

        <footer class="site-footer home-footer" id="kontakt" aria-label="Footer">
          <a class="site-footer-brand" href="/" aria-label="EinfachRonan Startseite">
            <img class="site-footer-logo" decoding="async" src="assets/logo-einfachronan.png" alt="EinfachRonan" />
          </a>
          <a class="site-footer-social" href="https://www.instagram.com/einfach.ronan/" target="_blank" rel="noreferrer">
            <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <path d="M17.5 6.5h.01"></path>
            </svg>
            <span>@einfach.ronan</span>
          </a>
        </footer>
      </section>
    </main>

    <audio
      data-ambient-audio
      preload="auto"
      loop
      playsinline
      src="assets/leberch-ethereal-cinematic-512569.mp3"
    ></audio>

    <button
      class="music-toggle"
      type="button"
      data-music-toggle
      aria-pressed="false"
      aria-label="Hintergrundmusik starten"
      hidden
    >
      <span class="music-toggle-icon" aria-hidden="true"></span>
      <span class="music-toggle-label">Ambiente</span>
    </button>

    <script src="script.js?v=cinematic-premium-2"></script>
  </body>
</html>
